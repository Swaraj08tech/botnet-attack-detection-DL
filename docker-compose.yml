# Whole application on one machine:  docker compose up -d   ->  http://localhost:8080
#
# Before the first start:
#   1. Put the model bundle in ./serving/bundle (build it with scripts/build_serving_bundle.py,
#      or download serving-bundle.zip from the GitHub release and unzip it there).
#   2. Copy deployment/.env.example to .env next to this file and fill in the secrets.
# The language model is optional:  docker compose --profile llm up -d   (then: docker compose exec ollama ollama pull qwen2.5:7b)
# Without it, incident reports are evidence-only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attack_detection
      POSTGRES_USER: ${POSTGRES_USER:-attack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d attack_detection"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/swaraj08tech/botnet-attack-detection-backend:latest}
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attack}:${POSTGRES_PASSWORD}@db:5432/attack_detection
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes: [./serving/bundle:/bundle:ro, app-data:/data]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/swaraj08tech/botnet-attack-detection-frontend:latest}
    build: ./frontend
    ports: ["${HTTP_PORT:-8080}:8080"]
    depends_on: [backend]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    volumes: [ollama-models:/root/.ollama]
    restart: unless-stopped
    # With an NVIDIA GPU and the NVIDIA Container Toolkit, uncomment to run the model on the GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  db-data:
  app-data:
  ollama-models:
